<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>أسطورة العروس</title>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#faf5f8;--card:#fff;--ink:#1f1424;--muted:#6e5f75;--line:#eadfee;--accent:#8e2a52;--accent2:#752042;--soft:#f6e8ef;--ok:#237a54;--bad:#b82c2c;--r:16px;--sh:0 6px 20px rgba(31,20,36,.08)}
:root[data-theme=dark]{--bg:#140d18;--card:#1f1524;--ink:#f5edf7;--muted:#aa9bb3;--line:#33233b;--accent:#e05c8f;--accent2:#f075a4;--soft:#2d1d33;--ok:#4fd99b;--bad:#f87171;--sh:0 6px 20px rgba(0,0,0,.4)}
@media(prefers-color-scheme:dark){:root:not([data-theme=light]){--bg:#140d18;--card:#1f1524;--ink:#f5edf7;--muted:#aa9bb3;--line:#33233b;--accent:#e05c8f;--accent2:#f075a4;--soft:#2d1d33;--ok:#4fd99b;--bad:#f87171;--sh:0 6px 20px rgba(0,0,0,.4)}}
[hidden]{display:none!important}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.6 "IBM Plex Sans Arabic",system-ui,sans-serif}
button,input,textarea,select{font:inherit;color:inherit}
button{cursor:pointer;border:1px solid var(--line);background:var(--card);border-radius:12px;padding:10px 16px;font-weight:600}
button.pri{background:var(--accent);border-color:var(--accent);color:#fff}
button.pri:hover{background:var(--accent2)}
button:disabled{opacity:.5;cursor:not-allowed}
input,textarea,select{width:100%;padding:11px 14px;background:var(--bg);border:1px solid var(--line);border-radius:12px}
input:focus,textarea:focus{outline:2px solid var(--accent);border-color:transparent}
label{display:block;font-weight:600;font-size:.88rem;margin:12px 0 5px}
.wrap{max-width:1100px;margin:auto;padding:0 16px}
header{position:sticky;top:0;z-index:50;background:var(--card);border-bottom:1px solid var(--line)}
.hd{display:flex;align-items:center;gap:10px;padding:12px 0}
.hd h1{margin:0;font-size:1.25rem;color:var(--accent);flex:0 0 auto}
.hd .search{flex:1}
.cartbtn{position:relative;padding:10px 14px}
.cartbtn b{position:absolute;top:-6px;left:-6px;background:var(--accent);color:#fff;border-radius:99px;min-width:20px;height:20px;font-size:.72rem;display:grid;place-items:center;padding:0 5px}
.banner{padding:10px 16px;text-align:center;font-weight:600;font-size:.9rem}
.notice{background:var(--soft);color:var(--accent)}
.closed{background:var(--bad);color:#fff}
.hero{padding:16px 0 2px;text-align:center}
.hero h2{font-size:1.7rem;margin:0 0 6px}
.hero p{margin:0;color:var(--muted)}
.chips{display:flex;gap:8px;overflow-x:auto;padding:14px 0;scrollbar-width:none}
.chip{white-space:nowrap;border-radius:99px;padding:8px 18px;background:var(--card)}
.chip.on{background:var(--accent);border-color:var(--accent);color:#fff}
.subchips .chip{padding:5px 14px;font-size:.84rem;background:var(--soft)}
h3.sec{margin:22px 0 12px;font-size:1.15rem}
.grid{display:grid;grid-template-columns:repeat(var(--cols,3),1fr);gap:10px}
@media(min-width:700px){.grid{grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:14px}}
.pc{background:var(--card);border:1px solid var(--line);border-radius:var(--r);overflow:hidden;cursor:pointer;transition:.2s;position:relative}
.pc:hover{transform:translateY(-3px);box-shadow:var(--sh)}
.pc img{width:100%;aspect-ratio:1;object-fit:cover;display:block;background:var(--soft)}
.pc .b{padding:7px 8px}
.pc .n{font-weight:700;font-size:.8rem;margin:0 0 1px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.pc .c{color:var(--muted);font-size:.68rem;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.pc .p{color:var(--accent);font-weight:700;font-size:.82rem;margin-top:3px}
.tag{position:absolute;top:6px;right:6px;background:var(--accent);color:#fff;font-size:.62rem;padding:1px 7px;border-radius:99px;font-weight:600}
.tag.out{background:var(--bad)}
.empty{text-align:center;color:var(--muted);padding:40px 0}
.ov{position:fixed;inset:0;background:rgba(0,0,0,.6);backdrop-filter:blur(3px);z-index:100;display:flex;align-items:flex-end;justify-content:center}
.sheet{background:var(--card);width:100%;max-width:560px;max-height:92vh;overflow:auto;border-radius:24px 24px 0 0;padding:20px}
@media(min-width:700px){.ov{align-items:center}.sheet{border-radius:22px}}
.drawer{justify-content:flex-start;align-items:stretch}
.drawer .sheet{max-width:440px;height:100%;max-height:none;border-radius:0;display:flex;flex-direction:column}
.pv{width:100%;aspect-ratio:1;object-fit:cover;border-radius:16px;background:var(--soft)}
.th{display:flex;gap:8px;overflow-x:auto;margin:10px 0}
.th img{width:58px;height:58px;object-fit:cover;border-radius:10px;border:2px solid var(--line);cursor:pointer}
.th img.on{border-color:var(--accent)}
.opts{display:flex;flex-wrap:wrap;gap:8px}
.opt.on{background:var(--soft);border-color:var(--accent);color:var(--accent)}
.price{font-size:1.5rem;font-weight:700;color:var(--accent);margin:8px 0}
.qty{display:inline-flex;align-items:center;gap:10px}
.qty button{padding:4px 12px}
.ci{display:flex;gap:10px;padding:10px 0;border-bottom:1px solid var(--line);align-items:center}
.ci img{width:56px;height:56px;border-radius:10px;object-fit:cover}
.ci .i{flex:1;min-width:0}
.ci small{color:var(--muted)}
.row{display:flex;justify-content:space-between;padding:4px 0}
.tot{font-size:1.15rem;font-weight:700;border-top:1px solid var(--line);margin-top:6px;padding-top:8px}
.warn{color:var(--bad);font-size:.85rem;font-weight:600}
footer{margin-top:50px;padding:28px 0;border-top:1px solid var(--line);text-align:center;color:var(--muted);font-size:.88rem}
#toast{position:fixed;bottom:24px;left:50%;transform:translateX(-50%) translateY(100px);background:var(--ink);color:var(--bg);padding:12px 22px;border-radius:99px;font-weight:600;opacity:0;transition:.3s;z-index:300;pointer-events:none}
#toast.show{transform:translateX(-50%);opacity:1}
header{backdrop-filter:blur(14px);background:color-mix(in srgb,var(--card) 88%,transparent)}
.hero{background:linear-gradient(135deg,var(--soft),transparent);border-radius:0 0 28px 28px;margin:0 -16px;padding:34px 16px 18px}
.vid{position:relative;border-radius:20px;overflow:hidden;aspect-ratio:16/9;background:#000;margin:14px 0;box-shadow:var(--sh)}
.vid iframe,.vid video{position:absolute;inset:0;width:100%;height:100%;border:0;object-fit:cover}
.pc{animation:up .4s both}@keyframes up{from{opacity:0;transform:translateY(10px)}}
.sheet{animation:sl .3s}@keyframes sl{from{transform:translateY(30px);opacity:0}}
.fbar{position:fixed;bottom:14px;left:0;right:0;margin:auto;width:calc(100% - 28px);max-width:520px;z-index:70;display:flex;justify-content:space-between;background:var(--accent);color:#fff;border:0;border-radius:16px;padding:14px 18px;font-weight:700;box-shadow:var(--sh)}
body{padding-bottom:84px}
.loc{background:var(--soft);border-radius:14px;padding:12px;margin-top:12px}
.loc small{display:block;color:var(--muted);margin-top:6px}
.soc a{color:var(--accent);font-weight:600;margin:0 8px}
html{background:var(--bg)}
.bg{position:fixed;inset:0;z-index:-1;overflow:hidden;direction:rtl}
.bg::after{content:"";position:absolute;inset:0;background:color-mix(in srgb,var(--bg) 60%,transparent)}
.bgt{display:flex;height:100%;width:100%}.bgi{flex:0 0 100%;background-size:cover;background-position:center}
body.hasbg{background:transparent}
.hasbg .pc{background:color-mix(in srgb,var(--card) 80%,transparent);backdrop-filter:blur(6px)}
.sheet{background:color-mix(in srgb,var(--card) 92%,transparent)}
.xbtn{position:sticky;top:0;float:left;z-index:5;width:38px;height:38px;border-radius:50%;padding:0;margin-bottom:-38px;background:var(--card)}
.sheet .stick{position:sticky;bottom:0}
.qa{position:absolute;top:4px;left:4px;z-index:2;width:24px;height:24px;border-radius:50%;padding:0;background:var(--accent);color:#fff;border:0;line-height:1}
.fbar{display:none!important}
.rep{position:fixed;bottom:84px;right:14px;z-index:70;width:44px;height:44px;border-radius:50%;background:#e03131;color:#fff;border:0;font-size:1.3rem;font-weight:700;padding:0}
.splash{position:fixed;inset:0;z-index:500;background:var(--bg);display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:24px;transition:opacity .6s}
.splash img{height:90px;margin-bottom:12px;border-radius:14px}.splash h2{font-size:1.5rem}.splash p{color:var(--muted)}
.heart{background:none;border:0;font-size:1.4rem;padding:4px}.cm{padding:8px 0;border-bottom:1px solid var(--line)}
.locimg{position:relative}.locimg img{width:100%;border-radius:14px;display:block}
.locimg i{position:absolute;width:44px;height:44px;border:3px solid #e03131;border-radius:50%;transform:translate(-50%,-50%)}
.locimg .zm{position:absolute;bottom:8px;left:8px;width:38%;border:3px solid #e03131;border-radius:12px}
.bnav{position:fixed;bottom:0;left:0;right:0;z-index:80;display:flex;background:color-mix(in srgb,var(--card) 92%,transparent);backdrop-filter:blur(14px);border-top:1px solid var(--line);padding:6px 4px calc(6px + env(safe-area-inset-bottom))}
.bnav button{flex:1;border:0;background:none;border-radius:12px;padding:6px 2px;display:flex;flex-direction:column;align-items:center;font-size:1.15rem;position:relative}
.bnav span{font-size:.62rem;font-weight:600;color:var(--muted)}.bnav .on span{color:var(--accent)}
.bnav b{position:absolute;top:0;left:50%;background:var(--accent);color:#fff;border-radius:99px;font-size:.62rem;min-width:16px}
.wafab{position:fixed;bottom:84px;left:14px;z-index:70;width:52px;height:52px;border-radius:50%;background:#25d366;display:grid;place-items:center;font-size:1.6rem;text-decoration:none;box-shadow:var(--sh)}
.chk{display:flex;gap:8px;align-items:center;font-weight:600;margin:6px 0}.chk input{width:auto}
.sw{flex:1;position:relative;min-width:0}
.sug{position:absolute;top:100%;right:0;left:0;margin-top:4px;background:var(--card);border:1px solid var(--line);border-radius:12px;box-shadow:var(--sh);max-height:320px;overflow:auto;z-index:60}
.sug button{display:block;width:100%;text-align:right;border:0;border-radius:0;background:none;padding:10px 14px;border-bottom:1px solid var(--line)}
.sug button:hover{background:var(--soft)}
.sk{height:150px;border-radius:var(--r);background:linear-gradient(90deg,var(--soft),var(--card),var(--soft));background-size:200% 100%;animation:sk 1.2s infinite}
@keyframes sk{to{background-position:-200% 0}}
</style>
</head>
<body>
<div id="bg" class="bg"></div>
<div id="splash" class="splash"><img id="slogo" alt="" hidden><h1 id="sn" style="margin:6px 0;color:var(--accent)">أسطورة العروس</h1><h2 id="sw"></h2><p id="sd"></p></div>
<script>
(function(){
 var W=["أنورت وأسفرت 🌹✨", "يا مرحبا ومسهلا 🤍", "حيّ الله من جانا ☕🌿", "أقبلت الأنوار 🌟", "مرحبا مليون 💛👑", "يا زين من لفانا 🫶🏻", "الله يحيّيك ويبقيك 🌷", "حيّاك ربي وبيّاك 🤍", "نورت المكان يا الغالي 🌹", "يا مرحبا ترحيبةٍ تليق بك 🐪✨"],D=["سبحان الله وبحمده 🌿", "أستغفر الله وأتوب إليه 🤍", "اللهم صلِّ وسلم على نبينا محمد ﷺ 🌹", "لا إله إلا الله ☝🏻", "سبحان الله العظيم ✨", "الحمد لله دائماً وأبداً 🤍", "اللهم اجعلها ساعة خير 🌸", "صلّوا على النبي ﷺ 🌙", "لا حول ولا قوة إلا بالله 🌿", "اللهم صلِّ على محمد وآله وسلم ﷺ 💚"],c={};
 try{c=JSON.parse(localStorage.getItem("splashCache")||"{}")}catch(e){}
 var p=function(a){return a[Math.floor(Math.random()*a.length)]},g=function(i){return document.getElementById(i)};
 g("sn").textContent=c.name||"أسطورة العروس";
 g("sw").textContent=p(c.wel&&c.wel.length?c.wel:W);
 g("sd").textContent=p(c.dhk&&c.dhk.length?c.dhk:D);
 if(c.logo){g("slogo").src=c.logo;g("slogo").hidden=false;}
 function hide(){var s=g("splash");if(!s)return;s.style.opacity=0;setTimeout(function(){s.remove()},600);}
 setTimeout(hide,3000);g("splash").onclick=hide;
})();
</script>
<header>
  <div class="wrap hd">
    <img id="logo" alt="" hidden style="height:38px;border-radius:8px"><h1 id="brand">أسطورة العروس</h1>

<main class="wrap">

  <div id="vidBox"></div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/11.0.2/firebase-app.js";
import { getFirestore, collection, addDoc, doc, getDoc, getDocs, updateDoc, setDoc, query, where, orderBy, limit, serverTimestamp } from "https://www.gstatic.com/firebasejs/11.0.2/firebase-firestore.js";

const app = initializeApp({
  apiKey:"AIzaSyDhZrTQ4QFM8AhznH5ArQa9A8_kY86G2vM",authDomain:"astorh-d60b8.firebaseapp.com",
  projectId:"astorh-d60b8",storageBucket:"astorh-d60b8.firebasestorage.app",
  messagingSenderId:"881683077545",appId:"1:881683077545:web:d5903a9dc5227194174cb8"
});
const db = getFirestore(app);
const $ = id => document.getElementById(id);
const NO_IMG = "data:image/svg+xml;charset=utf-8," + encodeURIComponent('<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120"><rect width="120" height="120" fill="#e4dce8"/><text x="60" y="66" font-size="13" text-anchor="middle" fill="#8a7d92" font-family="sans-serif">بدون صورة</text></svg>');

let S = {}, cats = [], prods = [], cart = [], selCat = "", selSub = "", term = "", bgList = [], view = "home";

/* أدوات */
function el(tag, props = {}, ...kids) {
  const e = document.createElement(tag);
  for (const [k, v] of Object.entries(props)) {
    if (k === "class") e.className = v;
    else if (k === "text") e.textContent = v;
    else if (k.startsWith("on")) e.addEventListener(k.slice(2), v);
    else if (v !== undefined && v !== null && v !== false) e.setAttribute(k, v);
  }
  kids.flat().forEach(c => c != null && e.append(c));
  return e;
}
const img = (src, cls = "") => { const i = el("img", { src: src || NO_IMG, alt: "", class: cls, loading: "lazy" }); i.onerror = () => { i.onerror = null; i.src = NO_IMG; }; return i; };
const money = n => (Math.round(n * 100) / 100) + " ر.س";
function toast(m) { const t = $("toast"); t.textContent = m; t.classList.add("show"); clearTimeout(toast.t); toast.t = setTimeout(() => t.classList.remove("show"), 2500); }
const ls = { get(k, d) { try { return JSON.parse(localStorage.getItem(k)) ?? d; } catch { return d; } }, set(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); } catch {} } };

/* المظهر */
const dark = () => { const t = document.documentElement.dataset.theme; return t ? t === "dark" : matchMedia("(prefers-color-scheme:dark)").matches; };
const icon = () => $("themeBtn").textContent = dark() ? "☀️" : "🌙";
$("themeBtn").onclick = () => { const n = dark() ? "light" : "dark"; document.documentElement.dataset.theme = n; ls.set("theme", n); icon(); };
if (ls.get("theme")) document.documentElement.dataset.theme = ls.get("theme");
icon();

/* الفيديو: يوتيوب / فيميو / رابط مباشر */
function videoEl() {
  const u = S.videoUrl.trim(), box = el("div", { class: "vid" });
  const yt = u.match(/(?:youtu\.be\/|v=|shorts\/|embed\/)([\w-]{11})/), vm = u.match(/vimeo\.com\/(\d+)/);
  const a = S.vAuto !== false ? 1 : 0, m = S.vMute !== false ? 1 : 0, l = S.vLoop !== false ? 1 : 0;
  if (yt) box.append(el("iframe", { src: `https://www.youtube.com/embed/${yt[1]}?autoplay=${a}&mute=${m}&loop=${l}&playlist=${yt[1]}&playsinline=1&rel=0`, allow: "autoplay; encrypted-media; fullscreen", allowfullscreen: "" }));
  else if (vm) box.append(el("iframe", { src: `https://player.vimeo.com/video/${vm[1]}?autoplay=${a}&muted=${m}&loop=${l}`, allow: "autoplay; fullscreen" }));
  else { const v = el("video", { src: u, playsinline: "", controls: "" }); v.autoplay = !!a; v.muted = !!m; v.loop = !!l; box.append(v); }
  return box;
}

/* حالة التوصيل */
function deliveryState() {
  if (S.deliveryOpen === false) return { open: false, msg: S.closedMsg || "المتجر مغلق حالياً ونستقبل الطلبات قريباً" };
  if (false) {
    const d = new Date(), now = d.getHours() * 60 + d.getMinutes();
    const m = t => { const [h, mi] = t.split(":").map(Number); return h * 60 + mi; };
    const a = m(S.fromTime), b = m(S.toTime);
    const inside = a <= b ? (now >= a && now <= b) : (now >= a || now <= b);
    if (!inside) return { open: false, msg: (S.closedMsg || "خارج أوقات استقبال الطلبات") + ` (من ${S.fromTime} إلى ${S.toTime})` };
  }
  return { open: true };
}

/* التحميل */
async function init() {
  $("list").append(...Array.from({ length: 6 }, () => el("div", { class: "sk" })));
  try {
    const [sSnap, cSnap, pSnap] = await Promise.all([
      getDoc(doc(db, "settings", "store")),
      getDocs(collection(db, "categories")),
      getDocs(collection(db, "products"))
    ]);
    S = sSnap.data() || {};
    if (S.freeFrom === undefined || S.freeFrom === "") S.freeFrom = 100;
    cats = cSnap.docs.map(d => ({ id: d.id, ...d.data() })).filter(c => c.active !== false).sort((a, b) => (a.order || 0) - (b.order || 0));
    prods = pSnap.docs.map(d => ({ id: d.id, ...d.data() })).filter(p => p.status !== "hidden");
  } catch (e) {
    $("list").replaceChildren(el("p", { class: "empty", text: "تعذر تحميل المتجر: " + e.message }));
    return;
  }
  cart = ls.get("cart", []);
  await loadMe();
  applySettings();
  renderChips();
  render();
  try { localStorage.setItem("splashCache", JSON.stringify({ name: S.storeName || "", logo: S.logoUrl || "", wel: lines2(S.welcomeText), dhk: lines2(S.dhikrText) })); } catch {}
  const dm = location.hash.match(/^#p=(.+)$/), dp = dm && prods.find(x => x.id === dm[1]);
